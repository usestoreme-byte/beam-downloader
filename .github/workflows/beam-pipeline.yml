name: BEAM Pipeline

on:
  workflow_dispatch:

concurrency:
  group: beam-pipeline-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/beam-downloader:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Commit State Files
        run: |
          git config --global --add safe.directory "*"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add state.json || true
          git add folders.json || true
          git commit -m "Update state [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

      
