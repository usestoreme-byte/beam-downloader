name: BEAM Pipeline

on:
  workflow_dispatch:

concurrency:
  group: beam-pipeline-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg mkvtoolnix tesseract-ocr mediainfo

      - name: Install Python dependencies
        run: |
          pip install telethon requests requests-toolbelt pymediainfo pgsrip

      - name: Run Pipeline Script
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_BASE64: ${{ secrets.TG_SESSION_BASE64 }}
          VIDARA_API_KEY: ${{ secrets.VIDARA_API_KEY }}
        run: python beam_pipeline.py

      - name: Commit State Files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add state.json folders.json || true
          git commit -m "Update state [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
